name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: mw4-windows-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      MW4_REFERENCE_OFFLINE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set build version
        shell: pwsh
        run: |
          # Windows-native capture is the v1 generation. Run 49 is v1.0.0,
          # then each subsequent release increments the patch version.
          $patch = [int]${{ github.run_number }} - 49
          if ($patch -lt 0) { $patch = 0 }
          $version = "1.0.$patch"
          npm version $version --no-git-tag-version
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building MW4 Camo Tracker v$version"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt pyinstaller

      - name: Validate source and run reliability tests
        shell: pwsh
        run: |
          node scripts/export-camo-catalog.cjs --check
          if ($LASTEXITCODE -ne 0) { throw "Worker camo catalog is stale" }
          node --check src/bootstrap.js
          if ($LASTEXITCODE -ne 0) { throw "Bootstrap syntax failed" }
          node --check src/main.js
          if ($LASTEXITCODE -ne 0) { throw "Main-process syntax failed" }
          node --check src/preload.js
          if ($LASTEXITCODE -ne 0) { throw "Preload syntax failed" }
          python -m compileall -q worker
          if ($LASTEXITCODE -ne 0) { throw "Worker compilation failed" }
          python -m unittest discover -s worker/tests -v
          if ($LASTEXITCODE -ne 0) { throw "Worker reliability tests failed" }
          node tests/unlockPolicy.test.js
          if ($LASTEXITCODE -ne 0) { throw "Unlock catalog tests failed" }
          node tests/reliability.test.js
          if ($LASTEXITCODE -ne 0) { throw "App reliability tests failed" }

      - name: Build detector exe
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name detector --collect-all rapidocr_onnxruntime --collect-all onnxruntime --collect-all windows_capture --collect-all mss --distpath worker-dist worker/detector_launcher.py

      - name: Smoke test packaged detector
        shell: pwsh
        run: |
          & .\worker-dist\detector.exe --help
          if ($LASTEXITCODE -ne 0) { throw "Packaged detector failed smoke test with exit code $LASTEXITCODE" }
          & .\worker-dist\detector.exe --self-test-ocr
          if ($LASTEXITCODE -ne 0) { throw "Packaged OCR model test failed" }

      - name: Install app dependencies
        run: npm install

      - name: Test reliability controls
        shell: pwsh
        run: |
          node tests/reliabilityUi.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Reliability controls failed" }
          node tests/completionStore.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Completion review storage failed" }
          node tests/completionUi.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Completion review controls failed" }

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MW4-Camo-Tracker-Windows-${{ env.APP_VERSION }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish app update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $assets = @()
          $assets += Get-ChildItem dist -Filter "*.exe" | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem dist -Filter "*.blockmap" | ForEach-Object { $_.FullName }
          if (Test-Path "dist/latest.yml") { $assets += (Resolve-Path "dist/latest.yml").Path }
          if ($assets.Count -lt 3) { throw "Installer, blockmap, and updater metadata were not all generated." }

          # Keep a partial upload invisible to electron-updater. Only publish after every
          # required asset was accepted by GitHub successfully.
          gh release create $tag @assets --title "MW4 Camo Tracker $env:APP_VERSION" --notes "Windows-native capture release $env:APP_VERSION" --draft
          if ($LASTEXITCODE -ne 0) { throw "Draft release upload failed." }

          $uploaded = gh release view $tag --json assets --jq '.assets[].name'
          $expected = @(
            (Get-ChildItem dist -Filter "*.exe" | Select-Object -First 1).Name,
            (Get-ChildItem dist -Filter "*.blockmap" | Select-Object -First 1).Name,
            "latest.yml"
          )
          foreach ($name in $expected) {
            if (-not ($uploaded -contains $name)) { throw "Release asset missing after upload: $name" }
          }

          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Release could not be published." }

