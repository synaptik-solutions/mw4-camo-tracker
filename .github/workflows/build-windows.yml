name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: mw4-windows-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set build version
        shell: pwsh
        run: |
          $version = "0.2.${{ github.run_number }}"
          npm version $version --no-git-tag-version
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building MW4 Camo Tracker v$version"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt pyinstaller

      - name: Build detector exe
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name detector --collect-all rapidocr_onnxruntime --collect-all onnxruntime --distpath worker-dist worker/detector.py

      - name: Install app dependencies
        run: npm install

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MW4-Camo-Tracker-Windows-${{ env.APP_VERSION }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish app update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $assets = @()
          $assets += Get-ChildItem dist -Filter "*.exe" | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem dist -Filter "*.blockmap" | ForEach-Object { $_.FullName }
          if (Test-Path "dist/latest.yml") { $assets += (Resolve-Path "dist/latest.yml").Path }
          if ($assets.Count -lt 2) { throw "Updater metadata was not generated." }
          gh release create $tag @assets --title "MW4 Camo Tracker $env:APP_VERSION" --notes "Automatic program update build $env:APP_VERSION" --latest
