<!doctype html><html><head><meta charset="UTF-8"><style>html,body{margin:0;background:transparent;font-family:Segoe UI,Arial,sans-serif;color:white}.box{margin:8px;background:rgba(7,12,19,.91);border:1px solid rgba(98,192,255,.42);border-radius:12px;padding:13px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}.tag{font-size:9px;letter-spacing:.16em;color:#66c8ff;font-weight:800}.weapon{font-size:20px;font-weight:800;margin-top:3px}.camo{color:#b7c4d4;margin-top:3px;font-size:13px}</style></head><body><div class="box"><div class="tag">MW4 CAMO TRACKER</div><div class="weapon" id="weapon">Watching…</div><div class="camo" id="camo">Waiting for an unlock</div></div><script>window.tracker.onOverlayEvent(e=>{document.getElementById('weapon').textContent=e.weapon||'UNKNOWN';document.getElementById('camo').textContent=e.camo||((e.family||'CAMO')+' '+(e.number||''));});</script></body></html>
